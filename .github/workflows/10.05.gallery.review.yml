name: "10.03-gallery review"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths: ["ch10/05/gallery/*.tf"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.14.7"
  AWS_REGION: "ap-northeast-2"
  WORKING_DIR: "ch10/05/gallery"

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format Check
        run: terraform fmt -check -recursive

      - name: Init (backend=false)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: tflint --init && tflint

      - name: Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}
          soft_fail: true

  plan:
    needs: quality-gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    strategy:
      matrix:
        env: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAMROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Temporary tfvars Files
        run: |
          if [ "${{ matrix.env }}" = "dev" ]; then
            cat <<EOF > env.dev.tfvars
            env                        = "dev"
            infra_lt_instance_type     = "t3.micro"
            infra_asg_max_size         = 3
            infra_asg_min_size         = 1
            infra_asg_desired_capacity = 2
            EOF
          elif [ "${{ matrix.env }}" = "prod" ]; then
            cat <<EOF > env.prod.tfvars
            env                        = "prod"
            infra_lt_instance_type     = "t3.small" # 운영 환경에 맞는 스펙으로 입력
            infra_asg_max_size         = 5
            infra_asg_min_size         = 2
            infra_asg_desired_capacity = 3
            EOF
          fi

      - name: Terraform Init
        run: terraform init -input=false -backend-config="env.${{ matrix.env }}.backend.hcl"

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -var-file="env.${{ matrix.env }}.tfvars" -lock=false -no-color
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1