name: gallery deploy

on:
  push:
    branches: [main]
    paths: ["ch10/05/gallery/**"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-terraformcore-10.03.lab01-deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.7"
  AWS_REGION: "ap-northeast-2"
  WORKING_DIR: "ch10/05/gallery"

jobs:
  apply-dev:
    runs-on: ubuntu-latest

    environment: dev
    
    concurrency:
      group: gallery-dev
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAMROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Temporary tfvars Files (dev)
        run: |
          cat << 'EOF' > env.dev.tfvars
          env                        = "dev"
          infra_lt_instance_type     = "t3.micro"
          infra_asg_max_size         = 3
          infra_asg_min_size         = 1
          infra_asg_desired_capacity = 2
          EOF

      - name: Terraform Init
        run: terraform init -backend-config="env.dev.backend.hcl"

      - name: Terraform Apply
        id: apply
        run: terraform apply -input=false -auto-approve -var-file="env.dev.tfvars"

  apply-prod:
    runs-on: ubuntu-latest

    environment: prod
    
    concurrency:
      group: gallery-prod
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAMROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Temporary tfvars Files (prod)
        run: |
          cat << 'EOF' > env.prod.tfvars
          env                        = "prod"
          infra_lt_instance_type     = "t3.small"
          infra_asg_max_size         = 5
          infra_asg_min_size         = 2
          infra_asg_desired_capacity = 3
          EOF

      - name: Terraform Init
        run: terraform init -backend-config="env.prod.backend.hcl"

      - name: Terraform Apply
        id: apply
        run: terraform apply -input=false -auto-approve -var-file="env.prod.tfvars"